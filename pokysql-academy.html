          &lt;div class=&quot;pk-table&quot;&gt;&lt;strong&gt;captures&lt;/strong&gt;&lt;span&gt;trainer_id · pokemon_id · captured_at&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;pk-table&quot;&gt;&lt;strong&gt;support_tickets&lt;/strong&gt;&lt;span&gt;ticket_id · trainer_id · priority · status&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;pk-table&quot;&gt;&lt;strong&gt;incidents&lt;/strong&gt;&lt;span&gt;incident_id · service · severity · started_at&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;pk-table&quot;&gt;&lt;strong&gt;ad_events&lt;/strong&gt;&lt;span&gt;event_id · campaign_id · event_type · event_at&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;pk-quest-line&quot;&gt;&lt;span&gt;Explain&lt;/span&gt;&lt;strong&gt;1 finding&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;pk-actions&quot;&gt;&lt;button id=&quot;pk-reset&quot; class=&quot;pk-button&quot; type=&quot;button&quot;&gt;Reset local progress&lt;/button&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById('pokysql-academy');
      const stages = [
        ['01', 'First SELECT', 'Read rows, filter, sort, and limit results.', ['SELECT', 'WHERE', 'ORDER BY']],
        ['02', 'Type Tactics', 'Handle NULL, CASE, text, dates, and casts.', ['NULL', 'CASE', 'Dates']],
        ['03', 'Build a Schema', 'Create tables, keys, constraints, and safe data changes.', ['DDL', 'Keys', 'Transactions']],
        ['04', 'Join Junction', 'Connect tables without losing or multiplying meaning.', ['JOINs', 'Grain', 'Anti-joins']],
        ['05', 'Gym Metrics', 'Turn records into reliable operational reports.', ['GROUP BY', 'HAVING', 'Ratios']],
        ['06', 'Mystery Cave', 'Use CTEs, subqueries, sets, and views.', ['CTEs', 'EXISTS', 'UNION']],
        ['07', 'Window Tower', 'Rank, compare, deduplicate, and analyze time.', ['ROW_NUMBER', 'LAG', 'Trends']],
        ['08', 'Incident HQ', 'Investigate tickets, SLAs, freshness, and anomalies.', ['SLA', 'QA', 'Debugging']],
        ['09', 'Procedure Lab', 'Execute database routines safely and document them.', ['CALL', 'Safety', 'Rollback']],
        ['10', 'Performance Pass', 'Read plans and reason about slow queries.', ['EXPLAIN', 'Indexes', 'Grain']],
        ['11', 'AdTech Safari', 'Analyze delivery, clicks, conversions, and discrepancies.', ['Events', 'Attribution', 'Pacing']],
        ['12', 'Elite Four', 'Complete the timed interview simulation and final test.', ['Synthesis', 'Communication', 'Speed']]
      ];

      const quizzes = [
        {
          prompt: 'You want every trainer, including trainers with no captures. Which join is the safest starting point?',
          choices: ['INNER JOIN captures', 'LEFT JOIN captures from trainers', 'CROSS JOIN captures'],
          answer: 1,
          good: 'Correct. Start with the complete population, then attach optional records.'
        },
        {
          prompt: 'Which condition correctly finds unresolved support tickets?',
          choices: ['resolved_at = NULL', 'resolved_at IS NULL', 'resolved_at == NULL'],
          answer: 1,
          good: 'Correct. NULL represents an unknown or missing value and needs IS NULL.'
        },
        {
          prompt: 'You need the most recent status for each campaign. Which tool is most natural?',
          choices: ['ROW_NUMBER() OVER (PARTITION BY campaign_id ORDER BY event_at DESC)', 'COUNT(*) with no GROUP BY', 'CROSS JOIN with campaigns'],
          answer: 0,
          good: 'Correct. Partition by campaign and order newest first, then keep row_number = 1.'
        },
        {
          prompt: 'A join doubles rows and inflates SUM(cost). What should you inspect first?',
          choices: ['Whether the join is many-to-many at the chosen grain', 'Whether ORDER BY is ascending', 'Whether the table has a primary key named id'],
          answer: 0,
          good: 'Correct. Verify relationship cardinality and the intended grain before trusting aggregates.'
        },
        {
          prompt: 'Which clause filters groups after aggregation?',
          choices: ['WHERE', 'HAVING', 'ORDER BY'],
          answer: 1,
          good: 'Correct. WHERE filters rows before grouping; HAVING filters grouped results.'
        }
      ];

      const storageKey = 'pokysql-academy-progress-v1';
      let state;
      try {
        state = JSON.parse(localStorage.getItem(storageKey) || '{}');
      } catch (error) {
        state = {};
      }
      state.done = Array.isArray(state.done) ? state.done : [];
      state.xp = Number.isFinite(state.xp) ? state.xp : 0;
      state.active = Number.isInteger(state.active) ? state.active : 0;
      state.quizIndex = Number.isInteger(state.quizIndex) ? state.quizIndex : 0;

      const $ = (selector) =&gt; root.querySelector(selector);
      const save = () =&gt; {
        try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (error) {}
      };

      const renderProgress = () =&gt; {
        const completed = state.done.length;
        const pct = Math.round((completed / stages.length) * 100);
        $('#pk-progress-text').textContent = `${completed} / ${stages.length} badges`;
        $('#pk-xp').textContent = `${state.xp} XP`;
        $('#pk-progress-bar').style.width = `${pct}%`;
        const rank = state.xp &gt;= 900 ? 'SQL Champion' : state.xp &gt;= 500 ? 'Query Ace' : state.xp &gt;= 200 ? 'Badge Collector' : 'SQL Trainer';
        $('#pk-rank').textContent = rank;
      };

      const renderMap = () =&gt; {
        const map = $('#pk-map');
        map.innerHTML = '';
        stages.forEach((stage, index) =&gt; {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'pk-stage';
          if (index === state.active) button.classList.add('is-active');
          if (state.done.includes(index)) button.classList.add('is-done');
          button.innerHTML = `&lt;span class=&quot;pk-stage-num&quot;&gt;BADGE ${stage[0]}&lt;/span&gt;&lt;span class=&quot;pk-stage-name&quot;&gt;${stage[1]}&lt;/span&gt;&lt;span class=&quot;pk-stage-state&quot;&gt;${state.done.includes(index) ? 'Complete · revisit' : 'Open quest'}&lt;/span&gt;`;
          button.addEventListener('click', () =&gt; { state.active = index; renderAll(); });
          map.appendChild(button);
        });
      };

      const renderDetail = () =&gt; {
        const stage = stages[state.active];
        const done = state.done.includes(state.active);
        $('#pk-detail').innerHTML = `&lt;div class=&quot;pk-detail-title&quot;&gt;Badge ${stage[0]} · ${stage[1]}&lt;/div&gt;&lt;div class=&quot;pk-detail-copy&quot;&gt;${stage[2]}&lt;/div&gt;&lt;div class=&quot;pk-tags&quot;&gt;${stage[3].map((tag) =&gt; `&lt;span class=&quot;pk-tag&quot;&gt;${tag}&lt;/span&gt;`).join('')}&lt;/div&gt;&lt;div class=&quot;pk-actions&quot;&gt;&lt;button id=&quot;pk-complete&quot; class=&quot;pk-button pk-primary&quot; type=&quot;button&quot;&gt;${done ? 'Badge complete' : 'Mark badge complete'}&lt;/button&gt;&lt;/div&gt;`;
        $('#pk-complete').disabled = done;
        $('#pk-complete').addEventListener('click', () =&gt; {
          if (!state.done.includes(state.active)) {
            state.done.push(state.active);
            state.xp += 100;
            save();
            renderAll();
          }
        });
      };

      const renderQuiz = () =&gt; {
        const quiz = quizzes[state.quizIndex % quizzes.length];
        $('#pk-quiz-count').textContent = `Encounter ${(state.quizIndex % quizzes.length) + 1} / ${quizzes.length}`;
        $('#pk-quiz-prompt').textContent = quiz.prompt;
        const choices = $('#pk-choices');
        choices.innerHTML = '';
        $('#pk-feedback').textContent = '';
        $('#pk-feedback').className = 'pk-feedback';
        quiz.choices.forEach((choice, index) =&gt; {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'pk-choice';
          button.textContent = choice;
          button.addEventListener('click', () =&gt; {
            Array.from(choices.children).forEach((item) =&gt; { item.disabled = true; });
            if (index === quiz.answer) {
              button.classList.add('is-correct');
              $('#pk-feedback').textContent = quiz.good;
              $('#pk-feedback').className = 'pk-feedback is-good';
              state.xp += 10;
              save();
              renderProgress();
            } else {
              button.classList.add('is-wrong');
              const correct = choices.children[quiz.answer];
              if (correct) correct.classList.add('is-correct');
              $('#pk-feedback').textContent = 'Not quite. Inspect the highlighted answer, then write the rule in your error log.';
              $('#pk-feedback').className = 'pk-feedback is-bad';
            }
          });
          choices.appendChild(button);
        });
      };

      const renderAll = () =&gt; {
        renderProgress();
        renderMap();
        renderDetail();
        renderQuiz();
        save();
      };

      $('#pk-next').addEventListener('click', () =&gt; { state.quizIndex += 1; renderQuiz(); });
      $('#pk-reset').addEventListener('click', () =&gt; {
        state = { done: [], xp: 0, active: 0, quizIndex: 0 };
        save();
        renderAll();
      });
      renderAll();
    })();
  &lt;/script&gt;

&lt;style id=&quot;codex-visualization-document-scrollbar&quot;&gt;html,body{scrollbar-width:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}&lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
