  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {

}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

      Pokémon facts and version-specific sprites are drawn from PokeAPI&#x27;s open dataset and sprite repository, cross-checked against Serebii and the official Pokémon Pokédex. The final PostgreSQL workflow is designed for RunSQL. Pokémon names and imagery belong to their respective rights holders; this is a personal educational project.

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/alasql@4.17.3/dist/alasql.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;pokysql-course-v2&#x27;);
      const $ = (selector) =&gt; root.querySelector(selector);

      const escapeHtml = (value) =&gt; String(value ?? &#x27;NULL&#x27;)
        .replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;)
        .replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;)
        .replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;)
        .replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;)
        .replaceAll(&quot;&#x27;&quot;, &#x27;&amp;#039;&#x27;);

      const spriteUrl = (generation, id) =&gt; {
        const version = generation === 1 ? &#x27;generation-i/red-blue&#x27; : generation === 2 ? &#x27;generation-ii/crystal&#x27; : &#x27;generation-iii/emerald&#x27;;
        return `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/versions/${version}/${id}.png`;
      };

      const pokemonDex = [
        { pokemon_id: 1, name: &#x27;Bulbasaur&#x27;, generation: 1, region: &#x27;Kanto&#x27;, primary_type: &#x27;Grass&#x27;, secondary_type: &#x27;Poison&#x27;, ability: &#x27;Overgrow&#x27;, base_experience: 64, height_m: 0.7, weight_kg: 6.9, hp: 45, attack: 49, defense: 49, special_attack: 65, special_defense: 65, speed: 45 },
        { pokemon_id: 25, name: &#x27;Pikachu&#x27;, generation: 1, region: &#x27;Kanto&#x27;, primary_type: &#x27;Electric&#x27;, secondary_type: null, ability: &#x27;Static&#x27;, base_experience: 112, height_m: 0.4, weight_kg: 6.0, hp: 35, attack: 55, defense: 40, special_attack: 50, special_defense: 50, speed: 90 },
        { pokemon_id: 94, name: &#x27;Gengar&#x27;, generation: 1, region: &#x27;Kanto&#x27;, primary_type: &#x27;Ghost&#x27;, secondary_type: &#x27;Poison&#x27;, ability: &#x27;Cursed Body&#x27;, base_experience: 225, height_m: 1.5, weight_kg: 40.5, hp: 60, attack: 65, defense: 60, special_attack: 130, special_defense: 75, speed: 110 },
        { pokemon_id: 133, name: &#x27;Eevee&#x27;, generation: 1, region: &#x27;Kanto&#x27;, primary_type: &#x27;Normal&#x27;, secondary_type: null, ability: &#x27;Run Away&#x27;, base_experience: 65, height_m: 0.3, weight_kg: 6.5, hp: 55, attack: 55, defense: 50, special_attack: 45, special_defense: 65, speed: 55 },
        { pokemon_id: 152, name: &#x27;Chikorita&#x27;, generation: 2, region: &#x27;Johto&#x27;, primary_type: &#x27;Grass&#x27;, secondary_type: null, ability: &#x27;Overgrow&#x27;, base_experience: 64, height_m: 0.9, weight_kg: 6.4, hp: 45, attack: 49, defense: 65, special_attack: 49, special_defense: 65, speed: 45 },
        { pokemon_id: 155, name: &#x27;Cyndaquil&#x27;, generation: 2, region: &#x27;Johto&#x27;, primary_type: &#x27;Fire&#x27;, secondary_type: null, ability: &#x27;Blaze&#x27;, base_experience: 62, height_m: 0.5, weight_kg: 7.9, hp: 39, attack: 52, defense: 43, special_attack: 60, special_defense: 50, speed: 65 },
        { pokemon_id: 158, name: &#x27;Totodile&#x27;, generation: 2, region: &#x27;Johto&#x27;, primary_type: &#x27;Water&#x27;, secondary_type: null, ability: &#x27;Torrent&#x27;, base_experience: 63, height_m: 0.6, weight_kg: 9.5, hp: 50, attack: 65, defense: 64, special_attack: 44, special_defense: 48, speed: 43 },
        { pokemon_id: 197, name: &#x27;Umbreon&#x27;, generation: 2, region: &#x27;Johto&#x27;, primary_type: &#x27;Dark&#x27;, secondary_type: null, ability: &#x27;Synchronize&#x27;, base_experience: 184, height_m: 1.0, weight_kg: 27.0, hp: 95, attack: 65, defense: 110, special_attack: 60, special_defense: 130, speed: 65 },
        { pokemon_id: 252, name: &#x27;Treecko&#x27;, generation: 3, region: &#x27;Hoenn&#x27;, primary_type: &#x27;Grass&#x27;, secondary_type: null, ability: &#x27;Overgrow&#x27;, base_experience: 62, height_m: 0.5, weight_kg: 5.0, hp: 40, attack: 45, defense: 35, special_attack: 65, special_defense: 55, speed: 70 },
        { pokemon_id: 255, name: &#x27;Torchic&#x27;, generation: 3, region: &#x27;Hoenn&#x27;, primary_type: &#x27;Fire&#x27;, secondary_type: null, ability: &#x27;Blaze&#x27;, base_experience: 62, height_m: 0.4, weight_kg: 2.5, hp: 45, attack: 60, defense: 40, special_attack: 70, special_defense: 50, speed: 45 },
        { pokemon_id: 258, name: &#x27;Mudkip&#x27;, generation: 3, region: &#x27;Hoenn&#x27;, primary_type: &#x27;Water&#x27;, secondary_type: null, ability: &#x27;Torrent&#x27;, base_experience: 62, height_m: 0.4, weight_kg: 7.6, hp: 50, attack: 70, defense: 50, special_attack: 50, special_defense: 50, speed: 40 },
        { pokemon_id: 376, name: &#x27;Metagross&#x27;, generation: 3, region: &#x27;Hoenn&#x27;, primary_type: &#x27;Steel&#x27;, secondary_type: &#x27;Psychic&#x27;, ability: &#x27;Clear Body&#x27;, base_experience: 270, height_m: 1.6, weight_kg: 550.0, hp: 80, attack: 135, defense: 130, special_attack: 95, special_defense: 90, speed: 70 }
      ];

      pokemonDex.forEach((pokemon) =&gt; {
        pokemon.sprite = spriteUrl(pokemon.generation, pokemon.pokemon_id);
        pokemon.base_stat_total = pokemon.hp + pokemon.attack + pokemon.defense + pokemon.special_attack + pokemon.special_defense + pokemon.speed;
      });

      const pokemonRows = pokemonDex.slice(0, 4).map((pokemon) =&gt; [pokemon.pokemon_id, pokemon.name, pokemon.primary_type, pokemon.base_experience]);

      const tableHtml = (headers, rows, highlightRow = -1) =&gt; `
        &lt;div class=&quot;pa-table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;${headers.map((h) =&gt; `&lt;th&gt;${escapeHtml(h)}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;${rows.map((row, index) =&gt; `&lt;tr class=&quot;${index === highlightRow ? &#x27;pa-highlight-row&#x27; : &#x27;&#x27;}&quot;&gt;${row.map((cell) =&gt; `&lt;td&gt;${escapeHtml(cell)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;

      const modules = [
        {
          name: &#x27;Pokédex Basics&#x27;,
          outcome: &#x27;Understand databases, tables, rows, columns, and values.&#x27;,
          job: &#x27;Support analysts must know what a record represents before trusting a query.&#x27;,
          steps: [
            {
              kicker: &#x27;Begin here · no prior knowledge required&#x27;,
              title: &#x27;A database is an organized collection of facts&#x27;,
              copy: &#x27;Imagine a digital Pokédex. Instead of storing everything in one paragraph, it organizes facts so a computer can find them reliably. A &lt;strong&gt;database&lt;/strong&gt; holds related collections of data; each collection is usually a &lt;strong&gt;table&lt;/strong&gt;.&#x27;,
              demo: `&lt;div class=&quot;pa-flow&quot;&gt;&lt;div class=&quot;pa-flow-item&quot;&gt;&lt;strong&gt;Database&lt;/strong&gt;&lt;span&gt;Pokémon League records&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pa-flow-item&quot;&gt;&lt;strong&gt;Table&lt;/strong&gt;&lt;span&gt;One organized collection, such as pokemon&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`
            },
            {
              kicker: &#x27;See the structure&#x27;,
              title: &#x27;Tables are made of rows and columns&#x27;,
              copy: &#x27;A &lt;strong&gt;row&lt;/strong&gt; is one thing—in this table, one Pokémon. A &lt;strong&gt;column&lt;/strong&gt; is one kind of fact, such as name or type. A &lt;strong&gt;cell&lt;/strong&gt; is one value at the intersection.&#x27;,
              demo: `${tableHtml([&#x27;pokemon_id&#x27;, &#x27;name&#x27;, &#x27;type&#x27;, &#x27;base_xp&#x27;], pokemonRows, 0)}&lt;div class=&quot;pa-anatomy&quot;&gt;&lt;div class=&quot;pa-anatomy-item&quot;&gt;&lt;strong&gt;Row&lt;/strong&gt;&lt;span&gt;Pikachu and all its facts&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pa-anatomy-item&quot;&gt;&lt;strong&gt;Column&lt;/strong&gt;&lt;span&gt;type for every Pokémon&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pa-anatomy-item&quot;&gt;&lt;strong&gt;Cell&lt;/strong&gt;&lt;span&gt;Electric is Pikachu&#x27;s type&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`
            },
            {
              kicker: &#x27;Mastery check · everything was just taught&#x27;,
              title: &#x27;In the Pokémon table, what does one row represent?&#x27;,
              copy: &#x27;Choose the answer that matches the table you just explored.&#x27;,
              check: {
                choices: [&#x27;One Pokémon and its facts&#x27;, &#x27;One column name&#x27;, &#x27;The entire database&#x27;],
                answer: 0,
                explanation: &#x27;Exactly. The table’s grain is one row per Pokémon.&#x27;
              }
            }
          ]
        },
        {
          name: &#x27;Your First Query&#x27;,
          outcome: &#x27;Read a simple SELECT ... FROM query in plain English.&#x27;,
          job: &#x27;Most support investigations begin by retrieving a small, relevant set of columns.&#x27;,

        const pct = Math.round((complete / modules.length) * 100);

        $(&#x27;#pa-progress-bar&#x27;).style.width = `${pct}%`;
        const rank = complete === modules.length ? &#x27;SQL League Champion&#x27; : complete &gt;= 9 ? &#x27;Support Ace&#x27; : complete &gt;= 5 ? &#x27;Query Trainer&#x27; : complete &gt;= 1 ? &#x27;Rising Trainer&#x27; : &#x27;New Trainer&#x27;;
        $(&#x27;#pa-rank&#x27;).textContent = `${rank} · ${state.xp} XP`;
      };

      const renderModules = () =&gt; {
        const host = $(&#x27;#pa-modules&#x27;);
        host.innerHTML = &#x27;&#x27;;
        modules.forEach((module, index) =&gt; {
          const button = document.createElement(&#x27;button&#x27;);
          const isDone = state.completed.includes(index);
          const isUnlocked = unlocked(index);
          button.type = &#x27;button&#x27;;
          button.className = `pa-module${index === state.module ? &#x27; is-active&#x27; : &#x27;&#x27;}${isDone ? &#x27; is-done&#x27; : &#x27;&#x27;}`;
          button.disabled = !isUnlocked;
          button.setAttribute(&#x27;aria-label&#x27;, `${module.name}: ${isDone ? &#x27;complete&#x27; : isUnlocked ? &#x27;available&#x27; : &#x27;locked&#x27;}`);
          const mentor = pokemonDex.find((pokemon) =&gt; pokemon.pokemon_id === module.mentorId);
          button.innerHTML = `&lt;span class=&quot;pa-module-num&quot;&gt;${isDone ? &#x27;✓&#x27; : `&lt;img class=&quot;pa-module-sprite&quot; src=&quot;${mentor.sprite}&quot; alt=&quot;&quot;&gt;`}&lt;/span&gt;&lt;span class=&quot;pa-module-name&quot;&gt;${String(index + 1).padStart(2, &#x27;0&#x27;)} · ${module.name}&lt;/span&gt;&lt;span class=&quot;pa-module-state&quot;&gt;${isDone ? &#x27;done&#x27; : isUnlocked ? &#x27;open&#x27; : &#x27;🔒&#x27;}&lt;/span&gt;`;
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            state.module = index;
            state.step = 0;
            save();
            renderAll();
          });
          host.appendChild(button);
        });
      };

      const renderDots = () =&gt; {
        const host = $(&#x27;#pa-step-dots&#x27;);
        host.innerHTML = &#x27;&#x27;;
        modules[state.module].steps.forEach((step, index) =&gt; {
          const dot = document.createElement(&#x27;span&#x27;);
          dot.className = `pa-step-dot${index === state.step ? &#x27; is-current&#x27; : index &lt; state.step ? &#x27; is-past&#x27; : &#x27;&#x27;}`;
          host.appendChild(dot);
        });
      };

      const renderQuery = (query) =&gt; `
        &lt;div class=&quot;pa-demo&quot;&gt;
          &lt;pre&gt;${query.code}&lt;/pre&gt;
          &lt;div class=&quot;pa-run-row&quot;&gt;&lt;button class=&quot;pa-button is-primary pa-run&quot; type=&quot;button&quot;&gt;Run query&lt;/button&gt;&lt;span class=&quot;pa-feedback&quot;&gt;Read-only practice query&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;pa-output&quot;&gt;${tableHtml(query.headers, query.rows)}&lt;/div&gt;
        &lt;/div&gt;`;

      const renderCheck = (check) =&gt; `
        &lt;div class=&quot;pa-choices&quot;&gt;${check.choices.map((choice, index) =&gt; `&lt;button class=&quot;pa-choice&quot; type=&quot;button&quot; data-choice=&quot;${index}&quot;&gt;${choice}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
        &lt;div class=&quot;pa-feedback&quot; id=&quot;pa-feedback&quot;&gt;&lt;/div&gt;
        &lt;div id=&quot;pa-claim-wrap&quot;&gt;&lt;/div&gt;`;

      const renderMentor = () =&gt; {
        const module = modules[state.module];
        const mentor = pokemonDex.find((pokemon) =&gt; pokemon.pokemon_id === module.mentorId);
        const types = [mentor.primary_type, mentor.secondary_type].filter(Boolean);
        return `
          &lt;aside class=&quot;pa-mentor&quot; aria-label=&quot;${escapeHtml(mentor.name)} Pokédex mentor card&quot;&gt;
            &lt;div class=&quot;pa-mentor-visual&quot;&gt;&lt;img class=&quot;pa-mentor-sprite&quot; src=&quot;${mentor.sprite}&quot; alt=&quot;${escapeHtml(mentor.name)} sprite from Generation ${mentor.generation}&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;pa-mentor-name&quot;&gt;#${String(mentor.pokemon_id).padStart(3, &#x27;0&#x27;)} · ${escapeHtml(mentor.name)}&lt;/div&gt;
            &lt;div class=&quot;pa-mentor-meta&quot;&gt;${mentor.region} · Generation ${mentor.generation} · ${mentor.ability}&lt;/div&gt;
            &lt;div class=&quot;pa-type-row&quot;&gt;${types.map((type) =&gt; `&lt;span class=&quot;pa-type&quot;&gt;${escapeHtml(type)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
            &lt;div class=&quot;pa-dex-stats&quot;&gt;
              &lt;div class=&quot;pa-dex-stat&quot;&gt;&lt;span&gt;Base XP&lt;/span&gt;&lt;strong&gt;${mentor.base_experience}&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;pa-dex-stat&quot;&gt;&lt;span&gt;Base stat total&lt;/span&gt;&lt;strong&gt;${mentor.base_stat_total}&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;pa-dex-stat&quot;&gt;&lt;span&gt;Height&lt;/span&gt;&lt;strong&gt;${mentor.height_m} m&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;pa-dex-stat&quot;&gt;&lt;span&gt;Weight&lt;/span&gt;&lt;strong&gt;${mentor.weight_kg} kg&lt;/strong&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/aside&gt;`;
      };

      const renderResultRows = (rows) =&gt; {
        if (!Array.isArray(rows)) return &#x27;&lt;div class=&quot;pa-feedback is-bad&quot;&gt;The engine did not return a result set.&lt;/div&gt;&#x27;;
        if (rows.length === 0) return &#x27;&lt;div class=&quot;pa-feedback&quot;&gt;Query ran successfully and returned 0 rows.&lt;/div&gt;&#x27;;
        const headers = Object.keys(rows[0]);
        return tableHtml(headers, rows.slice(0, 50).map((row) =&gt; headers.map((header) =&gt; row[header])));
      };

      const queryIsReadOnly = (query) =&gt; {
        const trimmed = query.trim();
        const statements = trimmed.split(&#x27;;&#x27;).map((statement) =&gt; statement.trim()).filter(Boolean);
        if (statements.length !== 1 || !/^(SELECT|WITH)\b/i.test(statements[0])) return false;
        return !/\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|TRUNCATE|REPLACE|CALL|EXEC|MERGE|GRANT|REVOKE)\b/i.test(statements[0]);
      };

      const renderLab = () =&gt; {
        const challenge = labChallenges[state.module];
        const complete = state.labCompleted.includes(state.module);
        $(&#x27;#pa-lab-status&#x27;).textContent = labReady ? `${complete ? &#x27;Trial cleared&#x27; : &#x27;Trial open&#x27;} · ${state.labCompleted.length}/${labChallenges.length}` : &#x27;Practice engine offline&#x27;;

        if (!labReady) {
          $(&#x27;#pa-lab-body&#x27;).innerHTML = `&lt;div class=&quot;pa-arena-lock&quot;&gt;${escapeHtml(labError || &#x27;The practice engine is unavailable.&#x27;)}&lt;/div&gt;`;
          return;
        }

        const draft = state.labDrafts[state.module] || challenge.starter;
        $(&#x27;#pa-lab-body&#x27;).innerHTML = `
          &lt;div class=&quot;pa-lab-grid&quot;&gt;
            &lt;section class=&quot;pa-lab-panel&quot;&gt;
              &lt;div class=&quot;pa-step-kicker&quot;&gt;Badge ${String(state.module + 1).padStart(2, &#x27;0&#x27;)} lab · ${complete ? &#x27;cleared ✓&#x27; : &#x27;40 XP&#x27;}&lt;/div&gt;
              &lt;h3&gt;${escapeHtml(challenge.title)}&lt;/h3&gt;
              &lt;div class=&quot;pa-lab-copy&quot;&gt;${escapeHtml(challenge.prompt)}&lt;/div&gt;
              &lt;div class=&quot;pa-schema-chips&quot;&gt;${challenge.schema.map((item) =&gt; `&lt;span class=&quot;pa-schema-chip&quot;&gt;${escapeHtml(item)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
              &lt;div class=&quot;pa-hint&quot; id=&quot;pa-lab-hint&quot;&gt;Professor hint: ${escapeHtml(challenge.hint)}&lt;/div&gt;
            &lt;/section&gt;
            &lt;section class=&quot;pa-lab-panel&quot;&gt;
              &lt;label class=&quot;pa-step-kicker&quot; for=&quot;pa-sql-editor&quot;&gt;Portable SQL practice&lt;/label&gt;
              &lt;textarea id=&quot;pa-sql-editor&quot; class=&quot;pa-editor&quot; spellcheck=&quot;false&quot; aria-label=&quot;SQL query editor&quot;&gt;${escapeHtml(draft)}&lt;/textarea&gt;
              &lt;div class=&quot;pa-lab-actions&quot;&gt;
                &lt;button id=&quot;pa-lab-run&quot; class=&quot;pa-button is-primary&quot; type=&quot;button&quot;&gt;Run SQL&lt;/button&gt;
                &lt;button id=&quot;pa-lab-reset&quot; class=&quot;pa-button&quot; type=&quot;button&quot;&gt;Restore starter&lt;/button&gt;
                &lt;button id=&quot;pa-lab-hint-button&quot; class=&quot;pa-button&quot; type=&quot;button&quot;&gt;Show hint&lt;/button&gt;
                &lt;span id=&quot;pa-lab-feedback&quot; class=&quot;pa-feedback&quot;&gt;SELECT and WITH queries only · browser SQL&lt;/span&gt;
              &lt;/div&gt;
              &lt;div id=&quot;pa-lab-results&quot; class=&quot;pa-lab-results&quot;&gt;&lt;/div&gt;
            &lt;/section&gt;
          &lt;/div&gt;
          &lt;div class=&quot;pa-job-link&quot;&gt;&lt;strong&gt;Dialect note:&lt;/strong&gt; This instant lab emphasizes portable query logic. Your final arena runs as PostgreSQL in RunSQL, where you will use production-style CTEs and window functions.&lt;/div&gt;`;

        const editor = $(&#x27;#pa-sql-editor&#x27;);
        editor.addEventListener(&#x27;input&#x27;, () =&gt; {
          state.labDrafts[state.module] = editor.value;
          save();
        });

        $(&#x27;#pa-lab-hint-button&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          $(&#x27;#pa-lab-hint&#x27;).classList.add(&#x27;is-visible&#x27;);
        });

        $(&#x27;#pa-lab-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          editor.value = challenge.starter;
          state.labDrafts[state.module] = challenge.starter;
          $(&#x27;#pa-lab-results&#x27;).innerHTML = &#x27;&#x27;;
          $(&#x27;#pa-lab-feedback&#x27;).textContent = &#x27;Starter restored. Predict the result before you run it.&#x27;;
          $(&#x27;#pa-lab-feedback&#x27;).className = &#x27;pa-feedback&#x27;;
          save();
        });

        $(&#x27;#pa-lab-run&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          const query = editor.value;
          const feedback = $(&#x27;#pa-lab-feedback&#x27;);
          const results = $(&#x27;#pa-lab-results&#x27;);
          state.labAttempts[state.module] = Number(state.labAttempts[state.module] || 0) + 1;
          if (!queryIsReadOnly(query)) {
            results.innerHTML = &#x27;&#x27;;
            feedback.textContent = &#x27;Safety lock: use one read-only SELECT or WITH query. Data-changing and procedure statements are blocked.&#x27;;
            feedback.className = &#x27;pa-feedback is-bad&#x27;;
            $(&#x27;#pa-lab-hint&#x27;).classList.add(&#x27;is-visible&#x27;);
            save();
            return;
          }
          try {
            const rows = window.alasql(query);
            results.innerHTML = renderResultRows(rows);
            if (challenge.validate(rows)) {
              const firstClear = !state.labCompleted.includes(state.module);
              if (firstClear) {
                state.labCompleted.push(state.module);
                state.xp += 40;
              }
              feedback.textContent = firstClear ? &#x27;Trial cleared! Result shape and values match the mission. +40 XP&#x27; : &#x27;Trial cleared again. Repetition strengthens recall.&#x27;;
              feedback.className = &#x27;pa-feedback is-good&#x27;;
              $(&#x27;#pa-lab-status&#x27;).textContent = `Trial cleared · ${state.labCompleted.length}/${labChallenges.length}`;
              renderProgress();
            } else {
              feedback.textContent = &#x27;The query ran, but the result does not yet match the mission. Check columns, filters, grain, and ordering.&#x27;;
              feedback.className = &#x27;pa-feedback is-bad&#x27;;
              $(&#x27;#pa-lab-hint&#x27;).classList.add(&#x27;is-visible&#x27;);
            }
          } catch (error) {
            results.innerHTML = &#x27;&#x27;;
            feedback.textContent = `SQL error: ${error.message}`;
            feedback.className = &#x27;pa-feedback is-bad&#x27;;
            $(&#x27;#pa-lab-hint&#x27;).classList.add(&#x27;is-visible&#x27;);
          }
          save();
        });
      };

      const renderArena = () =&gt; {
        const host = $(&#x27;#pa-arena-body&#x27;);
        if (state.completed.length &lt; modules.length) {
          host.innerHTML = `&lt;div class=&quot;pa-arena-lock&quot;&gt;&lt;strong&gt;Earn all 12 badges to enter.&lt;/strong&gt;&lt;br&gt;${modules.length - state.completed.length} badge${modules.length - state.completed.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;} remain. Your browser lab progress is ${state.labCompleted.length}/${labChallenges.length}; clearing all trials is strongly recommended.&lt;/div&gt;`;
          return;
        }
        host.innerHTML = `
          &lt;div class=&quot;pa-arena-grid&quot;&gt;
            &lt;section class=&quot;pa-lab-panel&quot;&gt;
              &lt;div class=&quot;pa-step-kicker&quot;&gt;Six realistic investigation stations&lt;/div&gt;
              &lt;div class=&quot;pa-scenario-list&quot;&gt;
                &lt;div class=&quot;pa-scenario&quot;&gt;&lt;strong&gt;Reporting delay&lt;/strong&gt;&lt;span&gt;Separate campaign serving from dashboard freshness and correlate tickets to incidents.&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;pa-scenario&quot;&gt;&lt;strong&gt;Pixel and HTML5 validation&lt;/strong&gt;&lt;span&gt;Gather reproducible evidence before escalating tags, parameters, or click-tag failures.&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;pa-scenario&quot;&gt;&lt;strong&gt;Offline attribution&lt;/strong&gt;&lt;span&gt;Find duplicates, upload lag, rejected orders, and mismatched attribution windows.&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;pa-scenario&quot;&gt;&lt;strong&gt;Campaign underdelivery&lt;/strong&gt;&lt;span&gt;Inspect status, zero-impression intervals, targeting edits, and exchange-level delivery.&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;pa-scenario&quot;&gt;&lt;strong&gt;Spend discrepancy&lt;/strong&gt;&lt;span&gt;Aggregate to campaign-day grain before comparing spend to budget.&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;pa-scenario&quot;&gt;&lt;strong&gt;SLA triage and de-escalation&lt;/strong&gt;&lt;span&gt;Prioritize evidence, customer impact, workaround, ownership, and the next update time.&lt;/span&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/section&gt;
            &lt;section class=&quot;pa-lab-panel&quot;&gt;
              &lt;div class=&quot;pa-step-kicker&quot;&gt;100-point final test · suggested time 90 minutes&lt;/div&gt;
              &lt;h3&gt;Build the database in RunSQL&lt;/h3&gt;
              &lt;div class=&quot;pa-lab-copy&quot;&gt;This implements the exact hands-on workflow your friend recommended: create the schema, load realistic data, answer unseen SQL questions, diagnose incidents, and explain your decisions aloud. The behavioral section also turns your own experiences into STAR stories; no private stories were assumed.&lt;/div&gt;
              &lt;div class=&quot;pa-downloads&quot; style=&quot;margin-top: 12px&quot;&gt;
                &lt;a class=&quot;pa-button is-primary&quot; href=&quot;/capstone/README.md&quot;&gt;Open test &amp; setup&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/ttd-adtech-schema.dbml&quot;&gt;DBML schema&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/advertisers.csv&quot;&gt;Advertisers CSV&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/campaigns.csv&quot;&gt;Campaigns CSV&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/campaign_status_history.csv&quot;&gt;Status history CSV&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/ad_events_daily.csv&quot;&gt;Ad events CSV&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/offline_conversions.csv&quot;&gt;Conversions CSV&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/support_tickets.csv&quot;&gt;Tickets CSV&lt;/a&gt;
                &lt;a class=&quot;pa-button&quot; href=&quot;/capstone/incidents.csv&quot;&gt;Incidents CSV&lt;/a&gt;
              &lt;/div&gt;
              &lt;div class=&quot;pa-job-link&quot; style=&quot;margin-top: 12px&quot;&gt;&lt;strong&gt;Passing standard:&lt;/strong&gt; 90/100, no unsafe production action, no inflated spend from incorrect grain, and no discrepancy diagnosis before definitions and time boundaries are aligned.&lt;/div&gt;
            &lt;/section&gt;
          &lt;/div&gt;
          &lt;div class=&quot;pa-job-link&quot;&gt;&lt;strong&gt;Interview story workshop:&lt;/strong&gt; prepare five concise STAR stories—deep troubleshooting, client de-escalation, SLA prioritization, cross-functional escalation, and a knowledge-base or process improvement. Attach a measurable result and one lesson learned to each.&lt;/div&gt;`;
      };

      const bindStageInteractions = (step) =&gt; {
        const run = $(&#x27;.pa-run&#x27;);
        if (run) {
          run.addEventListener(&#x27;click&#x27;, () =&gt; {
            const output = $(&#x27;.pa-output&#x27;);
            output.classList.add(&#x27;is-visible&#x27;);
            run.textContent = &#x27;Query ran ✓&#x27;;
            run.disabled = true;
          });
        }

        if (step.check) {
          root.querySelectorAll(&#x27;.pa-choice&#x27;).forEach((button) =&gt; {
            button.addEventListener(&#x27;click&#x27;, () =&gt; {
              const selected = Number(button.dataset.choice);
              const feedback = $(&#x27;#pa-feedback&#x27;);
              root.querySelectorAll(&#x27;.pa-choice&#x27;).forEach((choiceButton) =&gt; {
                choiceButton.disabled = true;
              });
              if (selected === step.check.answer) {
                button.classList.add(&#x27;is-correct&#x27;);
                feedback.textContent = step.check.explanation;
                feedback.className = &#x27;pa-feedback is-good&#x27;;
                if (!state.passed.includes(state.module)) state.passed.push(state.module);
                const isDone = state.completed.includes(state.module);
                $(&#x27;#pa-claim-wrap&#x27;).innerHTML = isDone ? &#x27;&lt;span class=&quot;pa-feedback is-good&quot;&gt;Badge already earned. Revisit anytime.&lt;/span&gt;&#x27; : &#x27;&lt;button id=&quot;pa-claim&quot; class=&quot;pa-button is-primary&quot; type=&quot;button&quot;&gt;Claim badge and unlock next lesson&lt;/button&gt;&#x27;;
                const claim = $(&#x27;#pa-claim&#x27;);
                if (claim) {
                  claim.addEventListener(&#x27;click&#x27;, () =&gt; {
                    if (!state.completed.includes(state.module)) {
                      state.completed.push(state.module);
                      state.xp += 100;
                    }
                    if (state.module &lt; modules.length - 1) {
                      state.module += 1;
                      state.step = 0;
                    }
                    save();
                    renderAll();
                  });
                }
                save();
              } else {
                button.classList.add(&#x27;is-wrong&#x27;);
                const correct = root.querySelector(`.pa-choice[data-choice=&quot;${step.check.answer}&quot;]`);
                if (correct) correct.classList.add(&#x27;is-correct&#x27;);
                feedback.textContent = &#x27;Not yet. Review the highlighted answer, then go Back through the lesson before retrying.&#x27;;
                feedback.className = &#x27;pa-feedback is-bad&#x27;;
              }
            });
          });
        }
      };

      const renderLesson = () =&gt; {
        const module = modules[state.module];
        state.step = Math.min(state.step, module.steps.length - 1);
        const step = module.steps[state.step];
        $(&#x27;#pa-module-eyebrow&#x27;).textContent = `Badge ${String(state.module + 1).padStart(2, &#x27;0&#x27;)} · Step ${state.step + 1} of ${module.steps.length}`;
        $(&#x27;#pa-module-title&#x27;).textContent = module.name;
        $(&#x27;#pa-module-outcome&#x27;).textContent = module.outcome;
        renderDots();

        let body = `&lt;div class=&quot;pa-step-kicker&quot;&gt;${step.kicker}&lt;/div&gt;&lt;div class=&quot;pa-step-title&quot;&gt;${step.title}&lt;/div&gt;&lt;div class=&quot;pa-step-copy&quot;&gt;${step.copy}&lt;/div&gt;`;
        if (step.demo) body += `&lt;div class=&quot;pa-demo&quot;&gt;${step.demo}&lt;/div&gt;`;
        if (step.query) body += renderQuery(step.query);
        if (step.check) body += renderCheck(step.check);
        body += `&lt;div class=&quot;pa-job-link&quot;&gt;&lt;strong&gt;Why this matters at The Trade Desk:&lt;/strong&gt; ${module.job}&lt;/div&gt;`;
        $(&#x27;#pa-stage&#x27;).innerHTML = `&lt;div class=&quot;pa-stage-main&quot;&gt;${body}&lt;/div&gt;${renderMentor()}`;

        $(&#x27;#pa-back&#x27;).disabled = state.step === 0;
        $(&#x27;#pa-next&#x27;).style.display = step.check ? &#x27;none&#x27; : &#x27;&#x27;;
        $(&#x27;#pa-next&#x27;).disabled = state.step &gt;= module.steps.length - 1;
        bindStageInteractions(step);
      };

      const renderAll = () =&gt; {
        renderProgress();
        renderModules();
        renderLesson();
        renderLab();
        renderArena();
        save();
      };

      $(&#x27;#pa-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        if (state.step &gt; 0) {
          state.step -= 1;
          renderAll();
        }
      });

      $(&#x27;#pa-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const steps = modules[state.module].steps;
        if (state.step &lt; steps.length - 1) {
          state.step += 1;
          renderAll();
        }
      });

      $(&#x27;#pa-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state = { completed: [], passed: [], labCompleted: [], labDrafts: {}, labAttempts: {}, module: 0, step: 0, xp: 0 };
        save();
        renderAll();
      });

      if (!unlocked(state.module)) {
        state.module = 0;
        state.step = 0;
      }
      initializeLab();
      renderAll();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
